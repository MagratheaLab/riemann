# claimed is a live lock. It must not stick on closed issues.
name: issue-close

on:
  issues:
    types: [closed]

jobs:
  drop-claimed:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: remove claimed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels/claimed" \
            || true
