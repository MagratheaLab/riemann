# Job name `gate` must always run: riemann ruleset requires that check.
# Delivery = packet/ branch AND CERTIFICATE.json in THIS PR's diff → rc gate --ci
# Catalog island = new .lean, no cert in the diff → lake build only
# Onboarding (docs, receipts move) never uses leftover certs from main.
name: gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: branch contract
        run: |
          REF="${GITHUB_HEAD_REF}"
          echo "head=$REF"
          if echo "$REF" | grep -Eq '^packet/P-[0-9]{8}-[a-z0-9]+$'; then
            echo "packet branch OK"
          elif echo "$REF" | grep -Eq '^onboarding/[A-Za-z0-9._/-]+$'; then
            echo "onboarding catalog OK"
          else
            echo "branch must be packet/P-YYYYMMDD-xxxx or onboarding/..."
            exit 1
          fi
      - name: kind
        id: kind
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
          echo "$CHANGED"
          REF="${GITHUB_HEAD_REF}"
          if echo "$REF" | grep -Eq '^packet/P-[0-9]{8}-[a-z0-9]+$' && echo "$CHANGED" | grep -Eq '(^|/)CERTIFICATE\.json$'; then
            echo "mode=delivery" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -Eq '\.lean$'; then
            echo "mode=catalog" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.kind.outputs.mode == 'delivery'
        with:
          python-version: "3.12"
      - name: install rc
        if: steps.kind.outputs.mode == 'delivery'
        run: pip install "rc-cli @ git+https://github.com/MagratheaLab/rc.git"
      - name: pull pinned gate image
        if: steps.kind.outputs.mode == 'delivery' || steps.kind.outputs.mode == 'catalog'
        run: |
          git clone --depth 1 https://github.com/MagratheaLab/rc.git /tmp/rc
          PIN=$(python3 -c "import json; print(json.load(open('/tmp/rc/gate/pin.json'))['digest'])")
          docker pull "ghcr.io/magrathealab/gate@${PIN}"
          echo "RC_GATE_IMAGE=ghcr.io/magrathealab/gate:lean-4.33.0@${PIN}" >> "$GITHUB_ENV"
          echo "PIN=$PIN" >> "$GITHUB_ENV"
      - name: rc gate delivery
        if: steps.kind.outputs.mode == 'delivery'
        env:
          RC_WORLD: ${{ github.workspace }}
          RC_REPO: ${{ github.repository }}
          RC_LAKE_MODE: docker
        run: |
          set -e
          PACKET="${GITHUB_HEAD_REF#packet/}"
          if [ -f "receipts/${PACKET}/CERTIFICATE.json" ]; then
            CERT="receipts/${PACKET}/CERTIFICATE.json"
          elif [ -f "CERTIFICATE.json" ]; then
            CERT="CERTIFICATE.json"
          else
            echo "delivery PR missing CERTIFICATE.json under receipts/${PACKET}/"
            exit 1
          fi
          PACKET=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['packet'])" "$CERT")
          rc gate --ci "$PACKET"
      - name: catalog lake
        if: steps.kind.outputs.mode == 'catalog'
        run: |
          set -e
          PACKET="${GITHUB_HEAD_REF#packet/}"
          TARGET=RiemannCanon
          if [ -f "packets/${PACKET}.md" ]; then
            T=$(awk -F': ' '/^lean_declaration:/{print $2; exit}' "packets/${PACKET}.md" | cut -d. -f1)
            [ -n "$T" ] && TARGET="$T"
          fi
          echo "lake build $TARGET (catalog island, not delivery)"
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,exec \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "ghcr.io/magrathealab/gate:lean-4.33.0@${PIN}" \
            bash -c "cp -R --no-preserve=ownership /repo /tmp/src && cd /tmp/src && lake build $TARGET"
      - name: skip
        if: steps.kind.outputs.mode == 'skip'
        run: echo "no Lean/CERTIFICATE in this PR diff; skip OK"
